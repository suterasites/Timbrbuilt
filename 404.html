<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found | Timbr Built</title>
  <meta name="description" content="That page does not exist. Head back to the Timbr Built homepage.">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="Assets/icon-navy.png">
  <link rel="apple-touch-icon" href="Assets/icon-navy.png">
  <style>
    @font-face{font-family:"Inter Tight";font-style:normal;font-weight:400 600;font-display:swap;
      src:url("/Assets/fonts/inter-tight-latin.woff2") format("woff2")}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;
      font-family:"Inter Tight",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:#0D0D0D;color:#fff;padding:2rem;text-align:center;-webkit-font-smoothing:antialiased}
    .w{max-width:34rem}
    .code{font-family:Georgia,"Times New Roman",serif;font-size:clamp(4.5rem,16vw,9rem);font-weight:400;
      line-height:.9;letter-spacing:-.02em;color:#EFEADD}
    h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.5rem,4vw,2.1rem);font-weight:400;
      line-height:1.05;margin:1.25rem 0 .75rem;letter-spacing:-.01em}
    p{font-size:1.02rem;line-height:1.5;color:rgba(255,255,255,.72)}
    .rule{width:3.5rem;height:1px;background:rgba(255,255,255,.3);margin:1.5rem auto}
    .btns{margin-top:2rem;display:flex;gap:.75rem;flex-wrap:wrap;justify-content:center}
    a.btn{display:inline-flex;align-items:center;height:41px;padding:0 24px;border:1px solid rgba(255,255,255,.85);
      border-radius:6px;color:#fff;text-decoration:none;font-size:16px;transition:background-color .2s,color .2s}
    a.btn:hover{background:#fff;color:#0D0D0D}
    a.btn.alt{border-color:rgba(255,255,255,.35)}
    a.btn:focus-visible{outline:2px solid #CDA678;outline-offset:3px}
    .biz{margin-top:2.5rem;font-size:13px;color:rgba(255,255,255,.5)}
  </style>
</head>
<body>
  <main class="w">
    <div class="code">404</div>
    <h1>That page does not exist</h1>
    <div class="rule"></div>
    <p>The link may be out of date, or the address might have a typo in it. Everything
       is still here, just at a different address.</p>
    <div class="btns">
      <a class="btn" href="/">Back to home</a>
      <a class="btn alt" href="/contact">Get in touch</a>
    </div>
    <div class="biz">Timbr Built</div>
  </main>
</body>
</html>
